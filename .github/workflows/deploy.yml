name: Deploy to VPS development

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ vars.VPS_HOST }}
        username: ${{ vars.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ vars.VPS_PORT || '22' }}
        script: |
          cd /opt/apps/cco

          git pull origin main

          docker compose down

          docker compose up -d --build

          # Aguardar banco ficar pronto
          echo "Aguardando banco de dados..."
          until docker compose exec -T postgres pg_isready -U "${POSTGRES_USER:-laravel}"; do
            sleep 2
          done

          # Aguardar app inicializar
          sleep 5

          docker compose exec -T app php artisan migrate --force

          docker compose exec -T app php artisan package:discover --ansi

          docker compose exec -T app php artisan cache:clear
          docker compose exec -T app php artisan config:clear
          docker compose exec -T app php artisan view:clear
          docker compose exec -T app php artisan optimize

          docker compose exec -T app php artisan queue:restart

          docker compose ps
