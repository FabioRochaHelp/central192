name: Laravel CI

on:
  push:
    branches: [ main, dev, georeferenciamento ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: laravel_test
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U laravel"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: pdo_pgsql, pgsql, redis, gd, zip, bcmath, mbstring, xml, curl
        coverage: xdebug

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Cache composer dependencies
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install PHP dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Install Node dependencies
      run: npm ci

    - name: Fix Flux CSS path for CI
      run: |
        # Criar diretório do Flux se não existir
        mkdir -p vendor/livewire/flux/dist
        # Criar CSS vazio para evitar erro de build
        echo "/* Dummy Flux CSS for CI */" > vendor/livewire/flux/dist/flux.css
        # Criar link simbólico alternativo
        ln -sf ../../../../vendor/livewire/flux/dist/flux.css resources/css/flux.css 2>/dev/null || true

    - name: Build Vite assets
      run: |
        # Tentar build normal
        if npm run build; then
          echo "✅ Build successful"
        else
          echo "⚠️ Build failed, creating dummy manifest for tests"
          mkdir -p public/build
          echo '{
            "resources/js/app.js": {
              "file": "assets/app.js",
              "src": "resources/js/app.js",
              "isEntry": true
            }
          }' > public/build/manifest.json
        fi

    - name: Create .env file
      run: |
        cat > .env << 'EOF'
        APP_NAME="CCO"
        APP_ENV=testing
        APP_DEBUG=true
        APP_KEY=

        DB_CONNECTION=pgsql
        DB_HOST=127.0.0.1
        DB_PORT=5432
        DB_DATABASE=laravel_test
        DB_USERNAME=laravel
        DB_PASSWORD=secret

        FIRE_DB_HOST=127.0.0.1
        FIRE_DB_PORT=5432
        FIRE_DB_DATABASE=laravel_test
        FIRE_DB_USERNAME=laravel
        FIRE_DB_PASSWORD=secret

        REDIS_HOST=127.0.0.1
        REDIS_PORT=6379
        REDIS_PASSWORD=null

        QUEUE_CONNECTION=sync
        CACHE_STORE=array
        SESSION_DRIVER=array
        BROADCAST_CONNECTION=null

        MAIL_MAILER=array

        OPERATIONS_CALL_WEBHOOK_SECRET="test-secret"
        OPERATIONS_CALL_INTAKE_URL_TTL_MINUTES=30
        OPERATIONS_BROADCAST_CALL_INTAKE=false

        TRACCAR_URL="https://test.com"
        TRACCAR_EMAIL='test@test.com'
        TRACCAR_PASSWORD='test'
        TRACCAR_TIMEOUT=10
        TRACCAR_POSITIONS_SYNC_INTERVAL=60
        EOF

    - name: Generate application key
      run: php artisan key:generate

    - name: Create storage link
      run: php artisan storage:link

    - name: Run migrations
      run: php artisan migrate --force

    - name: Run seeders
      run: |
        php artisan db:seed --class=OperationalDemoSeeder --force || true

    - name: Verify Vite manifest
      run: |
        if [ -f "public/build/manifest.json" ]; then
          echo "✅ Vite manifest found"
          cat public/build/manifest.json
        else
          echo "⚠️ Vite manifest not found"
        fi

    - name: Run tests
      run: php artisan test --coverage-text --coverage-clover=coverage.xml
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: laravel_test
        DB_USERNAME: laravel
        DB_PASSWORD: secret

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Docker images
      run: docker compose -f docker-compose.yml build --no-cache

    - name: Test Docker Compose up
      run: |
        docker compose -f docker-compose.yml up -d postgres redis
        sleep 10
        docker compose -f docker-compose.yml up -d app
        docker compose ps
        docker compose down

  docker-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create minimal .env for validation
      run: |
        cat > .env << 'EOF'
        DB_DATABASE=laravel
        DB_USERNAME=laravel
        DB_PASSWORD=secret
        FORWARD_HTTP_PORT=8888
        REVERB_SERVER_HOST=0.0.0.0
        REVERB_SERVER_PORT=8080
        EOF

    - name: Validate docker-compose.yml
      run: docker compose -f docker-compose.yml config

    - name: Run hadolint on Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: docker/php/Dockerfile
      continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    needs: tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci

    - name: Create Flux CSS stub for build
      run: |
        mkdir -p vendor/livewire/flux/dist
        echo "/* Flux CSS stub — pacote instalado via Composer em produção */" > vendor/livewire/flux/dist/flux.css

    - name: Build assets
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: public-assets
        path: |
          public/css
          public/js
          public/build
        retention-days: 7

  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'

    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist

    - name: Run security checker
      run: |
        composer require --dev enlightn/security-checker --no-interaction
        ./vendor/bin/security-checker security:check
      continue-on-error: true

    - name: Run npm audit
      run: npm audit --production --audit-level=moderate
      continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    needs: [tests, frontend, security]
    if: always()

    steps:
    - name: Pipeline success
      if: needs.tests.result == 'success' && needs.frontend.result == 'success'
      run: |
        echo "✅ CI Pipeline executado com sucesso!"
        echo "Testes: ${{ needs.tests.result }}"
        echo "Frontend: ${{ needs.frontend.result }}"
        echo "Security: ${{ needs.security.result }}"

    - name: Pipeline failure
      if: needs.tests.result == 'failure' || needs.frontend.result == 'failure'
      run: |
        echo "❌ Algum job falhou. Verifique os logs!"
        echo "Testes: ${{ needs.tests.result }}"
        echo "Frontend: ${{ needs.frontend.result }}"
        echo "Security: ${{ needs.security.result }}"
        exit 1
